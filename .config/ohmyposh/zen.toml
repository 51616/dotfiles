version = 2
final_space = true

[palette]
os       = "#A6ADC8"
closer   = "#6C7086"
pink     = "#F5C2E7"
lavender = "#B4BEFE"
blue     = "#89B4FA"
flamingo = "#F2CDCD"
teal     = "#94E2D5"
yellow   = "#F9E2AF"
green    = "#A6E3A1"
red      = "#F38BA8"

[[blocks]]
type = "prompt"
alignment = "left"
newline = true
  # ICON segment (separate)
  [[blocks.segments]]
  type = "path"
  style = "plain"
  foreground = "p:teal"
  template = '{{ if eq .Path "~" }} {{ else }} {{ end }}'
  separator = " "

# PATH segment (one segment, handles / correctly; slashes always non-bold + middle-colored)
  [[blocks.segments]]
  type = "path"
  style = "plain"
  template = '{{ $p := .Path }}{{ $firstColor := "#89B4FA" }}{{ $midColor := "#94E2D5" }}{{ if eq $p "~" }}<b><{{ $firstColor }}>~</></b>{{ else }}{{ $parts := splitList "/" $p }}{{ $n := len $parts }}{{ $last := sub $n 1 }}{{ if eq (index $parts 0) "" }}{{/* absolute */}}{{ if eq $p "/" }}<{{ $midColor }}>/</>{{ else }}<{{ $midColor }}>/</>{{ range $i, $s := $parts }}{{ if gt $i 0 }}{{ if or (eq $i 1) (eq $i $last) }}<b><{{ $firstColor }}>{{ $s }}</></b>{{ else }}<{{ $midColor }}>{{ $s }}</>{{ end }}{{ if lt $i $last }}<{{ $midColor }}>/</>{{ end }}{{ end }}{{ end }}{{ end }}{{ else }}{{/* home: starts with "~" */}}<b><{{ $firstColor }}>~</></b>{{ range $i, $s := $parts }}{{ if gt $i 0 }}<{{ $midColor }}>/</>{{ if eq $i $last }}<b><{{ $firstColor }}>{{ $s }}</></b>{{ else }}<{{ $midColor }}>{{ $s }}</>{{ end }}{{ end }}{{ end }}{{ end }}{{ end }} '
  properties = { style = "full", home_icon = "~" } 
  # # FIRST (cyan, bold): "~" for home paths, or first dir for absolute paths ("tmp"), or "/" for root
  # [[blocks.segments]]
  # type = "path"
  # style = "plain"
  # foreground = "#89B4FA"
  # template = '{{ $p := .Path }}{{ $parts := splitList "/" $p }}{{ if eq $p "~" }}<b>~</b> {{ else if eq $p "/" }}/ {{ else if eq (index $parts 0) "~" }}<b>~</b>{{ else }}<b>{{ index $parts 1 }}</b>{{ end }}'
  # properties = { style = "full", home_icon = "~" }
  #
  # # MIDDLE (blue): directories between first and last (no leading/trailing extra slash beyond "/name")
  # [[blocks.segments]]
  # type = "path"
  # style = "plain"
  # foreground = "#94E2D5"
  # template = '{{ $p := .Path }}{{ if or (eq $p "~") (eq $p "/") }}{{ else }}{{ $parts := splitList "/" $p }}{{ $n := len $parts }}{{ $last := sub $n 1 }}{{ if eq (index $parts 0) "" }}{{ range $i, $s := $parts }}{{ if and (gt $i 1) (lt $i $last) }}/{{ $s }}{{ end }}{{ end }}{{ else }}{{ range $i, $s := $parts }}{{ if and (gt $i 0) (lt $i $last) }}/{{ $s }}{{ end }}{{ end }}{{ end }}{{ end }}'
  # properties = { style = "full", home_icon = "~" }
  #
  # # SLASH BEFORE LAST (blue): always the separator between previous and last, except at "~" or "/"
  # [[blocks.segments]]
  # type = "path"
  # style = "plain"
  # foreground = "#94E2D5"
  # template = '{{ $p := .Path }}{{ if and (ne $p "~") (ne $p "/") }}/{{ end }}'
  #
  # # LAST (cyan, bold): last directory name only (no slash)
  # [[blocks.segments]]
  # type = "path"
  # style = "plain"
  # foreground = "#89B4FA"
  # template = '{{ $p := .Path }}{{ if or (eq $p "~") (eq $p "/") }}{{ else }}{{ $parts := splitList "/" $p }}<b>{{ index $parts (sub (len $parts) 1) }}</b>{{ end }} '
  # properties = { style = "full", home_icon = "~" }

  # Git branch (only shows when inside a git repo)
  [[blocks.segments]]
  type = "git"
  style = "plain"
  foreground = "p:lavender"
  template = "{{ .HEAD }} "
  [blocks.segments.properties]
  branch_icon = "\ue725 "
  cherry_pick_icon = "\ue29b "
  commit_icon = "\uf417 "
  fetch_status = false
  fetch_upstream_icon = false
  merge_icon = "\ue727 "
  no_commits_icon = "\uf0c3 "
  rebase_icon = "\ue728 "
  revert_icon = "\uf0e2 "
  tag_icon = "\uf412 "

[[blocks]]
type = "prompt"
alignment = "right"
filler = "<#6C7086,transparent>·</>"
  [[blocks.segments]]
  type = 'executiontime'
  style = 'plain'
  foreground = 'p:yellow'
  background = 'transparent'
  template = ' {{ .FormattedMs }}'

    [blocks.segments.properties]
    threshold = 5000
    style = 'round'

  [[blocks.segments]]
  type = "text"
  style = "plain"
  foreground = "p:flamingo"
  template = " <b>{{ .HostName }}</b>"

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

  [[blocks.segments]]
  type = 'text'
  style = 'plain'
  foreground_templates = [
    "{{if gt .Code 0}}p:red{{end}}",
    "{{if eq .Code 0}}p:green{{end}}",
  ]
  background = 'transparent'
  template = '❯'

[transient_prompt]
foreground_templates = [
  "{{if gt .Code 0}}p:red{{end}}",
  "{{if eq .Code 0}}p:green{{end}}",
]
background = 'transparent'
template = '❯ '

[secondary_prompt]
foreground = 'p:green'
background = 'transparent'
template = '❯❯ '
