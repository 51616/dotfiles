set -sg escape-time 50
set-option -sa terminal-overrides ",xterm*:RGB"
# set-option -sa terminal-overrides ",screen*:Tc"
# set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",xterm-256color:Tc"
set -g set-clipboard on
set -g allow-passthrough
set -as terminal-overrides ',*:Sync'
set -g mode-keys vi
set -gw cursor-style default
set-hook -g pane-mode-changed 'if-shell -F "#{pane_in_mode}" "set -w cursor-style block" "set -w cursor-style default"'

bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"
set-window-option -g xterm-keys on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g default-terminal xterm-256color

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
unbind C-s
unbind -n C-s
# bind y set-window-option synchronize-panes
bind C-s set-window-option synchronize-panes
bind r source-file ~/.tmux.conf


# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# scroll bindings: use half-page steps consistently
bind -n S-Pageup if-shell -F '#{pane_in_mode}' { send-keys -X halfpage-up } { copy-mode; send-keys -X halfpage-up }
bind -n F7 if-shell -F '#{pane_in_mode}' { send-keys -X halfpage-up } { copy-mode; send-keys -X halfpage-up }
bind -n M-, if-shell -F '#{pane_in_mode}' { send-keys -X halfpage-up } { copy-mode; send-keys -X halfpage-up }
bind -n F8 if-shell -F '#{pane_in_mode}' { send-keys -X halfpage-down } { copy-mode; send-keys -X halfpage-down }
bind -n M-. if-shell -F '#{pane_in_mode}' { send-keys -X halfpage-down } { copy-mode; send-keys -X halfpage-down }
bind -n S-Pagedown if-shell -F '#{pane_in_mode}' { send-keys -X halfpage-down } { copy-mode; send-keys -X halfpage-down }


# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Keep mouse scrolling/selecting, but disable tmux right-click menus.
unbind-key -n MouseDown3Pane
unbind-key -n MouseDown3Status
unbind-key -n MouseDown3StatusLeft
unbind-key -n M-MouseDown3Pane
unbind-key -n M-MouseDown3Status
unbind-key -n M-MouseDown3StatusLeft

# move status line to top
set -g status-position top

# taken from oh my tmux
set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

set -g display-panes-time 800 # slightly longer pane indicators display time

#use zsh
set-option -g default-shell $SHELL

# don't rename windows automatically
set-option -g allow-rename off

# copy mode
# bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-emacs Escape send-keys -X cancel

# To copy, left click and drag to highlight text in yellow, 
# once you release left click yellow text will disappear and will automatically be available in clibboard
# Update default binding of `Enter` to also use copy-pipe
